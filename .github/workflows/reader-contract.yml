name: Reader private extension contract
on:
  push:
    paths: ['reader/**', 'extension/**', 'scripts/package-reader.cjs', 'tests/**', 'package*.json', '.github/workflows/reader-contract.yml']
  pull_request:
    paths: ['reader/**', 'extension/**', 'scripts/package-reader.cjs', 'tests/**', 'package*.json', '.github/workflows/reader-contract.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: {node-version: '24'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: node scripts/package-reader.cjs https://reader.example.test "$RUNNER_TEMP/reader-private-extension"
